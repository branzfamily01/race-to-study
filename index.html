<style>

ine{height:2px;margin:9px 20%;background:linear-gradient(90deg,transparent,#188fff,transparent);box-shadow:0 0 12px #188fff}.progressbox{padding:15px;margin-top:10px}.bar{height:10px;border:1px solid #355269;border-radius:99px;background:#02060a;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#007dff,#69e8ff);box-shadow:0 0 12px #1fb8ff}.primary,.secondary,.back,.danger,.success{border-radius:13px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{border:1px solid #ffd07b;background:linear-gradient(135deg,#7b3300,var(--a),var(--a2));color:white;box-shadow:0 0 22px #ff760055,inset 0 0 13px #fff3}.primary.big{width:100%;font-size:20px;padding:17px}.secondary,.back{border:1px solid #2e6288;background:#07111d;color:#ddecfa}.danger{border:1px solid #8b3434;background:#2a0b0d;color:#ff8585}.success{border:1px solid #2f8c59;background:#0a2b19;color:#62f59d}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}.nav button{min-width:0;border:1px solid #234963;border-radius:13px;background:#07111d;color:#dce8f3;padding:9px 2px;font-size:11px}.nav span{display:block;font-size:22px;margin-bottom:2px}.nav button:disabled{opacity:.28}.muted{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.part{padding:13px;text-align:center;min-height:128px}.part .ico{font-size:32px}.part strong{display:block;margin:7px 0}.part.open{border-color:#ff9b2c;box-shadow:0 0 16px #ff7a0033}.list{display:grid;gap:9px}.item{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.item strong{display:block}.stars{color:#ffb21d}.caritem{display:grid;grid-template-columns:140px 1fr;align-items:center;cursor:pointer}.caritem img{width:140px;filter:var(--f);mix-blend-mode:screen}.caritem.sel{border-color:var(--a);box-shadow:0 0 18px #ff730044}.form{padding:14px;margin-top:14px}.form input,.form textarea{width:100%;background:#03090f;border:1px solid #315068;border-radius:10px;padding:11px;color:white;margin:5px 0}.lock{padding:14px;margin-bottom:12px}.missionmsg{padding:14px;display:grid;grid-template-columns:58px 1fr;gap:10px;margin:12px 0}.helmet{font-size:38px;display:grid;place-items:center}.missionitem{padding:14px;cursor:pointer}.missionitem.sel{border-color:#ff8b22;box-shadow:0 0 18px #ff760044}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:9px;margin-top:15px}.ign{text-align:center;min-height:92vh;display:flex;flex-direction:column;justify-content:center}.keyring{width:min(75vw,330px);aspect-ratio:1;margin:22px auto;border-radius:50%;border:2px solid #7b430d;background:radial-gradient(circle,#0a0f16 0 36%,#ff760018 37% 60%,transparent 61%);box-shadow:0 0 45px #ff760044,inset 0 0 30px #ff760022;display:grid;place-items:center;cursor:pointer}.key{font-size:105px;transform:rotate(var(--r,-25deg));transition:.55s}.timerhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.ray{padding:12px;margin:12px 0}.gauge{width:min(84vw,390px);aspect-ratio:1;margin:8px auto;border-radius:50%;padding:11px;background:conic-gradient(from 225deg,#168cff 0 calc(var(--p)*270deg),#213445 calc(var(--p)*270deg) 270deg,transparent 270deg);filter:drop-shadow(0 0 15px #168cff55)}.face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#0a1825 0 55%,#02070b 56%);border:1px solid #4c6d85}.time{font-size:clamp(48px,15vw,73px);font-weight:950}.remaining{text-align:center;letter-spacing:.2em;color:#5bc8ff;font-size:11px}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.times button{border:1px solid #315875;background:#07111d;color:#e7f2fc;border-radius:10px;padding:9px 2px;font-weight:850}.times button.on{border-color:#ff8b22;background:#291205;box-shadow:0 0 14px #ff760044}.times small{display:block;color:#61c7ff}.controls{display:flex;gap:8px;margin-top:13px}.controls>*{flex:1}.lane{margin:13px 0}.track{height:58px;background:#050a0 <script>
const C=[['マクラーレン P1','#ff7600','#ffc04b','none'],['マクラーレン スピードテール','#d9dfe5','#fff','grayscale(1) brightness(1.25)'],['ブガッティ ボリード','#087cff','#5ddcff','hue-rotate(165deg) saturate(1.5)'],['ラ フェラーリ','#d52323','#ff6049','hue-rotate(320deg) saturate(1.5)'],['ケーニグセグ アゲーラR','#555','#aaa','grayscale(1) brightness(.6)'],['ケーニグセグ レゲーラ','#7b2fbe','#c77dff','hue-rotate(235deg) saturate(1.5)'],['パガーニ ウアイラ ロードスター','#b8860b','#ffd65a','sepia(.8) saturate(.8)'],['日産 GT-R','#e4e9ee','#fff','grayscale(1) brightness(1.15)'],['ホンダ NSX-R','#fff','#eef6ff','grayscale(1) brightness(1.55)'],['ホンダ NSX','#ff4a19','#ff8263','hue-rotate(345deg) saturate(1.2)'],['ホンダ NSX タイプS','#333','#888','grayscale(1) brightness(.72)']].map((x,i)=>({id:i+1,name:x[0],a:x[1],a2:x[2],f:x[3]}));
const P=['エンジン','タイヤ(F)','タイヤ(R)','ウイング','ボディ','塗装 赤','塗装 青','塗装 金','ヘッドライト','ホイール A','ホイール B','エアロ','マフラー','インタークーラー','ブレーキ','サスペンション','シート','ステアリング','ECU','ニトロ'].map((n,i)=>({id:i+1,name:n,ico:['⚙️','🛞','🛞','✈️','🏎️','🔴','🔵','🟡','💡','⭕','🔘','💨','🔥','❄️','🛑','🔩','💺','🎯','💻','⚡'][i],cost:30}));
const OPT=[5,10,15,20,25,30,45,60],PT={5:5,10:12,15:20,20:30,25:40,30:50,45:70,60:100},K='raceToStudy_v4';
const fresh=()=>({points:0,totalPoints:0,streak:0,lastStudyDate:null,unlockedParts:[],selectedCarId:1,materials:[],sessions:[],nextMaterialId:1});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{s=fresh()}let u={screen:'home',sel:null,min:20,left:0,run:false,msg:'',parent:false,key:false,race:false,p:0,cpu:0,count:null,result:null,toast:'',overlay:null};let ti,ri,ci;const $=q=>document.querySelector(q),save=()=>localStorage.setItem(K,JSON.stringify(s)),car=()=>C.find(x=>x.id===s.selectedCarId)||C[0],esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),img=(cl='',filter=car().f)=>`<img class="car ${cl}" src="assets/supercar.webp" alt="${esc(car().name)}" style="--filter:${filter}">`,vars=()=>`--a:${car().a};--a2:${car().a2};--filter:${car().f}`;
function page(x){return `<section class="page" style="${vars()}"><div class="wrap">${x}</div></section>${u.toast?`<div class="toast">${esc(u.toast)}</div>`:''}${u.overlay?overlay():''}`};function pts(){return `<div class="pts"><b>${s.points}<span style="font-size:14px">pt</span></b><small>🔥 ${s.streak}日連続</small></div>`};function back(to='home'){return `<button class="back" data-go="${to}">← 戻る</button>`};function nav(){return `<div class="nav">${[['🚗','クルマ','cars'],['🔧','パーツ','parts'],['📚','教材','materials'],['🏁','レース','race'],['📋','引き継ぎ','transfer']].map((x,i)=>`<button data-go="${x[2]}" ${i===3&&s.unlockedParts.length<20?'disabled':''}><span>${x[0]}</span>${x[1]}</button>`).join('')}</div>`}
function home(){let n=s.unlockedParts.length;return page(`<div class="top"><div><div class="eyebrow">RACE TO STUDY</div><h1 class="title">ガレージ</h1></div>${pts()}</div><div class="hero">${img()}<div class="name">${esc(car().name)}</div><div class="line"></div></div><div class="card progressbox"><div class="row"><b>⚙️ パーツ収集率</b><b>${n}/20</b></div><div class="bar"><i style="--w:${n*5}%"></i></div></div><button class="primary big" data-go="engine" style="margin-top:14px">🔑 エンジン スタート！</button>${nav()}`)}
function engine(){return page(`<div class="ign">${back()}<div class="eyebrow" style="margin-top:20px">IGNITION SEQUENCE</div><h1 class="title">エンジン起動</h1><p class="muted">キーをタップして回す</p><div class="keyring" data-act="key"><div class="key" style="--r:${u.key?'55deg':'-25deg'}">🔑</div></div><b style="color:#ffae43">${u.key?'🔥 エンジン点火！':'⬆ タップ！'}</b><div style="height:135px;overflow:hidden;margin-top:10px">${img()}</div></div>`)}
function mission(){let a=s.materials.filter(m=>!m.done);return page(`<div class="top"><div><div class="eyebrow">TODAY'S MISSION</div><h1 class="title">今日のミッション</h1></div>${pts()}</div><div class="card missionmsg"><div class="helmet">🏎️</div><div><b style="color:#50bfff">レイ</b><div style="margin-top:5px">「よし！今日やる教材を確認しろ。スタート前の準備は大事だぞ！」</div></div></div><h3>📖 今日やる教材を選ぼう</h3><div class="list">${a.length?a.map(m=>`<div class="card missionitem ${u.sel===m.id?'sel':''}" data-mat="${m.id}"><div class="row"><div><strong>${esc(m.name)}</strong><span class="muted"> ${esc(m.subject||'教材')}</span></div><div class="stars">${'★'.repeat(m.difficulty)}</div></div></div>`).join(''):`<div class="card form">教材がありません。教材画面から追加してください。</div>`}</div><div class="actions">${back()}<button class="primary" data-go="timer">GO！ →</button></div>`)}
function timer(){let t=u.min*60,p=u.left?(t-u.left)/t:0,m=s.materials.find(x=>x.id===u.sel),mm=Math.floor(u.left/60),ss=u.left%60;return page(`<div class="timerhead">${back()}<div class="pts" style="min-width:0">📚 ${esc(m?.name||'フリー走行')}</div></div>${u.msg?`<div class="card ray">🏁 <b>「${esc(u.msg)}」</b></div>`:''}<div class="gauge" style="--p:${p}"><div class="face"><div><div class="time">${u.left?String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'):String(u.min).padStart(2,'0')+':00'}</div><div class="remaining">REMAINING</div></div></div></div><div style="width:88%;margin:-74px auto -5px">${img()}</div>${!u.run&&u.left===0?`<h3 style="text-align:center">勉強時間をえらぼう</h3><div class="times">${OPT.map(n=>`<button data-time="${n}" class="${n===u.min?'on':''}">${n}分<small>+${PT[n]}pt</small></button>`).join('')}</div>`:''}<div class="controls">${u.run?`<button class="secondary" data-act="pause">⏸ 一時停止</button>`:u.left?`<button class="primary" data-act="resume">▶ 再開</button><button class="secondary" data-act="reset">リセット</button>`:`<button class="primary big" data-act="start">▶ スタート！</button>`}</div>${m&&!m.done&&(u.run||u.left)?`<button class="success" style="width:100%;margin-top:10px" data-act="completeSel">🎉 教材おわった！ +25pt</button>`:''}`)}
function cars(){return page(`<div class="head">${back()}<h2>🚗 クルマを選ぶ</h2></div><div class="list">${C.map(c=>`<div class="card caritem ${c.id===s.selectedCarId?'sel':''}" data-car="${c.id}"><img src="assets/supercar.webp" style="--f:${c.f};filter:${c.f}"><div><strong>${esc(c.name)}</strong>${c.id===s.selectedCarId?'<div style="color:#ffad43">✓ 選択中</div>':''}</div></div>`).join('')}</div>`)}
function parts(){return page(`<div class="head">${back()}<h2>🔧 パーツ解放</h2><div class="pts" style="min-width:100px"><b>${s.points}pt</b></div></div><p><b style="font-size:28px;color:#52bfff">${s.unlockedParts.length}</b><span class="muted"> /20 パーツ解放済み</span></p><div class="grid">${P.map(p=>{let o=s.unlockedParts.includes(p.id);return `<button class="card part ${o?'open':''}" data-part="${p.id}" ${o?'disabled':''}><div class="ico">${p.ico}</div><strong>${p.name}</strong><span style="color:${o?'#ffb242':'#72c8ff'}">${o?'✓ 解放済み':p.cost+'pt → 解放！'}</span></button>`}).join('')}</div>${s.unlockedParts.length===20?'<div class="card result"><b style="color:#ffd24e">🏆 全パーツ解放！レース解放！</b></div>':''}`)}
function materials(){return page(`<div class="head">${back()}<h2>📚 教材リスト</h2></div>${!u.parent?`<div class="card lock"><b>🔒 保護者コード（4桁）</b><div class="row" style="margin-top:8px"><input id="code" inputmode="numeric" maxlength="4" placeholder="0000"><button class="secondary" data-act="unlock">解除</button></div><div class="muted">※デフォルト: 1234</div></div>`:`<div style="color:#65e99c;margin-bottom:10px">🔓 保護者モード：解除中</div>`}<div class="list">${s.materials.length?s.materials.map(m=>`<div class="card item"><div><strong style="${m.done?'text-decoration:line-through;color:#718090':''}">${esc(m.name)}</strong><span class="muted">${esc(m.subject||'')}</span><div class="stars">${'★'.repeat(m.difficulty)}${'☆'.repeat(5-m.difficulty)}</div></div><div style="display:grid;gap:6px">${!m.done?`<button class="success" data-done="${m.id}">完了！</button>`:''}${u.parent?`<button class="danger" data-del="${m.id}">削除</button>`:''}</div></div>`).join(''):'<div class="card form muted">教材がまだありません</div>'}</div>${u.parent?`<div class="card form"><h3 style="margin-top:0;color:#ffab3f">＋ 教材を追加</h3><input id="mn" placeholder="教材名（例：算数ドリル p.10）"><input id="ms" placeholder="教科（例：算数）"><label>難易度 <select id="md"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><button class="primary" style="width:100%;margin-top:10px" data-act="add">追加する</button></div>`:''}`)}
function lane(label,x,cpu){return `<div class="lane"><b style="color:${cpu?'#ff6b62':'#52bdff'}">${label}</b><div class="track"><div class="fill" style="--x:${Math.min(100,x)}%;${cpu?'background:linear-gradient(90deg,#a51d1d44,#ff484866)':''}"></div><img class="racecar" src="assets/supercar.webp" style="--x:${Math.min(100,x)}%;--filter:${cpu?'hue-rotate(320deg) saturate(1.5)':car().f};filter:${cpu?'hue-rotate(320deg) saturate(1.5)':car().f}"><span class="finish">🏁</span></div></div>`};function race(){return page(`<div class="head">${back()}<h2>🏎️ レース！</h2></div>${u.count!=null?`<div class="count">${u.count}</div>`:''}<div class="card form">${lane('あなた',u.p,false)}${lane('CPU',u.cpu,true)}</div>${u.result?`<div class="card result"><div style="font-size:44px">${u.result==='win'?'🏆':'😤'}</div><h2>${u.result==='win'?'優勝！チャンピオン！':'負けたぞ！リベンジだ！'}</h2></div>`:''}${!u.race&&u.count==null?`<button class="primary big" data-act="race">${u.result?'もう一度レース！':'レーススタート！'}</button>`:''}`)}
function transfer(){return page(`<div class="head">${back()}<h2>📋 引き継ぎ</h2></div><div class="card form"><h3>📤 エクスポート</h3><button class="primary" data-act="export">引き継ぎコードを生成</button><textarea id="out" rows="5" readonly></textarea><button class="secondary" data-act="copy">コピー</button></div><div class="card form"><h3>📥 インポート</h3><textarea id="in" rows="5" placeholder="引き継ぎコードを貼り付け"></textarea><button class="success" style="width:100%" data-act="import">データを引き継ぐ</button></div>`)}
function overlay(){let o=u.overlay;if(o.type==='part')return `<div class="overlay"><div class="card popup"><div class="big">${o.ico}</div><h2 style="color:#ffd04f">パーツ解放！</h2><b>${esc(o.name)}</b></div></div>`;return `<div class="overlay"><div class="card popup"><div class="big">🏆</div><h2 style="color:#ffd04f">ラップ完了！</h2><p>+${o.pt}pt 獲得！</p><button class="primary" data-act="close">ガレージへ</button></div></div>`}
const views={home,engine,mission,timer,cars,parts,materials,race,transfer};function render(){app.innerHTML=(views[u.screen]||home)();bind()}function go(x){if(u.run){clearInterval(ti);u.run=false}if(u.race){clearInterval(ri);u.race=false}u.screen=x;if(x==='engine')u.key=false;if(x==='mission')u.sel=s.materials.find(m=>!m.done)?.id||null;render()}function toast(x){u.toast=x;render();setTimeout(()=>{if(u.toast===x){u.toast='';render()}},1500)}function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-car]').forEach(e=>e.onclick=()=>{s.selectedCarId=+e.dataset.car;save();render()});document.querySelectorAll('[data-mat]').forEach(e=>e.onclick=()=>{u.sel=+e.dataset.mat;render()});document.querySelectorAll('[data-time]').forEach(e=>e.onclick=()=>{u.min=+e.dataset.time;render()});document.querySelectorAll('[data-part]').forEach(e=>e.onclick=()=>unlock(+e.dataset.part));document.querySelectorAll('[data-done]').forEach(e=>e.onclick=()=>done(+e.dataset.done));document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{s.materials=s.materials.filter(m=>m.id!==+e.dataset.del);save();render()});document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>act[e.dataset.act]?.())}
function key(){u.key=true;render();setTimeout(()=>go('mission'),750)}function start(){u.left=u.min*60;u.run=true;u.msg='エンジン全開！行くぞ！';tick();render()}function tick(){clearInterval(ti);ti=setInterval(()=>{u.left--;if(u.left===Math.floor(u.min*30))u.msg='いいペースだ！このまま行け！';if(u.left<=0){clearInterval(ti);u.run=false;completeTimer()}render()},1000)}function pause(){u.run=false;clearInterval(ti);render()}function resume(){u.run=true;u.msg='お前ならできる！';tick();render()}function reset(){u.run=false;u.left=0;clearInterval(ti);render()}function date(d=new Date()){return d.toISOString().slice(0,10)}function completeTimer(){let p=PT[u.min]||30,t=date(),y=new Date();y.setDate(y.getDate()-1);let st=s.streak,b=0;if(s.lastStudyDate===date(y)){st++;if(st%3===0)b=30}else if(s.lastStudyDate!==t)st=1;s.points+=p+b;s.totalPoints+=p+b;s.streak=st;s.lastStudyDate=t;s.sessions.push({date:t,minutes:u.min,pts:p+b});save();u.overlay={type:'done',pt:p+b};render()}function unlock(id){let p=P.find(x=>x.id===id);if(s.unlockedParts.includes(id))return;if(s.points<p.cost)return toast('ポイントが足りません');s.points-=p.cost;s.unlockedParts.push(id);save();u.overlay={type:'part',ico:p.ico,name:p.name};render();setTimeout(()=>{if(u.overlay?.type==='part'){u.overlay=null;render()}},1200)}function done(id){let m=s.materials.find(x=>x.id===id);if(!m||m.done)return;m.done=true;s.points+=25;s.totalPoints+=25;save();toast('+25pt！教材完了')}function completeSel(){if(u.sel)done(u.sel)}function unlockParent(){if($('#code')?.value==='1234'){u.parent=true;render()}else toast('コードが違います')}function add(){let n=$('#mn')?.value.trim();if(!n)return toast('教材名を入力してください');s.materials.push({id:s.nextMaterialId++,name:n,subject:$('#ms')?.value.trim(),difficulty:+$('#md')?.value,done:false});save();render()}
function startRace(){u.p=u.cpu=0;u.result=null;u.count=3;render();ci=setInterval(()=>{u.count--;if(u.count<=0){clearInterval(ci);u.count=null;u.race=true;runRace()}render()},850)}function runRace(){let boost=Math.min(s.totalPoints/1000,.5);ri=setInterval(()=>{u.p+=2.5+boost+Math.random()*1.3;u.cpu+=2.5+Math.random()*1.3;if(u.p>=100||u.cpu>=100){clearInterval(ri);u.race=false;u.p=Math.min(100,u.p);u.cpu=Math.min(100,u.cpu);u.result=u.p>=100&&u.p>=u.cpu?'win':'lose'}render()},100)}function enc(x){return btoa(unescape(encodeURIComponent(x)))}function dec(x){return decodeURIComponent(escape(atob(x)))}function exportD(){let e=$('#out');if(e)e.value=enc(JSON.stringify(s))}async function copy(){let e=$('#out');if(!e?.value)return;try{await navigator.clipboard.writeText(e.value);toast('コピーしました')}catch{e.select();document.execCommand('copy')}}function importD(){try{s={...fresh(),...JSON.parse(dec($('#in').value.trim()))};save();toast('引き継ぎ完了！');setTimeout(()=>go('home'),500)}catch{toast('コードが正しくありません')}}const act={key,start,pause,resume,reset,completeSel,unlock:unlockParent,add,race:startRace,export:exportD,copy,import:importD,close:()=>{u.overlay=null;go('home')}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
